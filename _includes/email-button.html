{%- comment %} Copies the address on click (scripts.html); the address is only assembled in the browser. {% endcomment %}
{%- assign email_parts = site.email | split: " (at) " %}
<button class="email" type="button" data-user="{{ email_parts[0] }}" data-domain="{{ email_parts[1] }}" aria-label="Copy email address: {{ site.email }}" title="{{ site.email }}">{% include icon.html name="mail" %}<span class="email-label">{{ include.label }}</span><span class="email-done" role="status"></span></button>
